spring:
  application:
    name: document-ingest-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?namespace=fta-namespace&group=DEFAULT_GROUP&extension=yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: fta-namespace
        file-extension: yaml
      discovery:
        server-addr: localhost:8848
        namespace: fta-namespace
        group: DEFAULT_GROUP
  rabbitmq:
    host: ${rabbitmq.host:localhost}
    port: ${rabbitmq.port:5672}
    username: ${rabbitmq.username:guest}
    password: ${rabbitmq.password:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8091

# 文档存储配置
# 文件存储路径，使用项目根目录下的 fta-data/documents
document:
  storage:
    path: ${DOCUMENT_STORAGE_PATH:D:/bianchenglianxi/project/Fault_Tree_Assistant/fta-data/documents}
  ocr:
    tessdata: ./tessdata

# 文档分类服务配置
classification:
  service:
    url: ${CLASSIFICATION_SERVICE_URL:http://localhost:8002}

# RAG服务配置（用于同步向量到Chroma）
rag:
  service:
    url: ${RAG_SERVICE_URL:http://localhost:8000}
