spring:
  application:
    name: feedback-learning-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?namespace=fta-namespace&group=DEFAULT_GROUP&extension=yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: fta-namespace
        file-extension: yaml
      discovery:
        server-addr: localhost:8848
        namespace: fta-namespace
        group: DEFAULT_GROUP
  datasource:
    url: ${datasource.url:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    driverClassName: ${datasource.driverClassName:oracle.jdbc.OracleDriver}
    username: ${datasource.username:fta_user}
    password: ${datasource.password:123456}
  jpa:
    database-platform: ${jpa.database-platform:org.hibernate.dialect.Oracle12cDialect}
    hibernate:
      ddl-auto: ${jpa.hibernate.ddl-auto:update}
    show-sql: ${jpa.show-sql:true}
  rabbitmq:
    host: ${rabbitmq.host:localhost}
    port: ${rabbitmq.port:5672}
    username: ${rabbitmq.username:guest}
    password: ${rabbitmq.password:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

server:
  port: 8085

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cxyaqcdm.fta.feedback.entity

# 反馈学习配置
feedback:
  learning:
    batch:
      size: 10
    update:
      interval: 3600000 # 1小时
