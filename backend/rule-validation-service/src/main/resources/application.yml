spring:
  application:
    name: rule-validation-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?namespace=fta-namespace&group=DEFAULT_GROUP&extension=yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: fta-namespace
        file-extension: yaml
      discovery:
        server-addr: localhost:8848
        namespace: fta-namespace
        group: DEFAULT_GROUP
  rabbitmq:
    host: ${rabbitmq.host:localhost}
    port: ${rabbitmq.port:5672}
    username: ${rabbitmq.username:guest}
    password: ${rabbitmq.password:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

server:
  port: 8093

# 规则引擎配置
rule:
  engine:
    rules:
      path: ./rules
    update:
      interval: 60000 # 规则更新间隔（毫秒）
