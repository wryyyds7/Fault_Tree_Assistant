# FTA 故障树生成 - 标准提示词模板
#
# 本文件用于存放故障树生成的标准提示词模板
# 包含 Few-Shot 示例、规则定义、关键词列表
#
# 使用说明：
# 1. 本文件中的提示词为标准模板，可直接使用或根据需求修改
# 2. 模板中使用 {variable} 表示需要替换的变量
# 3. 示例中的故障树仅供参考，请根据实际需求调整
#
# 最后更新：2026-03-26

# ============================================================================
# 故障树生成提示词模板
# ============================================================================
fault_tree_generation_prompt: |
  你是一位专业的工业设备故障分析专家，擅长构建故障树分析（FTA）。

  请基于以下提供的工业知识和数据，为顶事件 "{top_event}" 构建一个完整的故障树。

  ## 工业知识
  {industrial_knowledge}

  ## 知识图谱模板
  {kg_template}

  ## 任务要求
  请按照以下要求生成故障树：
  1. 清晰识别顶事件、中间事件和底事件
  2. 正确使用逻辑门（AND、OR、XOR）
  3. 确保故障树结构完整，逻辑合理
  4. 为每个事件提供简要说明和溯源依据
  5. 按照FTA标准格式输出故障树

  ## 输出格式
  请以JSON格式输出故障树，包含以下字段：
  - event_id: 事件唯一标识（如 evt_001, evt_002）
  - event_name: 事件名称（如 "电机过热"）
  - event_type: 事件类型（TOP/INTERMEDIATE/BASIC）
  - gate_type: 逻辑门类型（AND/OR/XOR，底事件不需要）
  - children: 子事件列表（数组）
  - source_evidence: 溯源依据（来自哪个文档段落）
  - equipment_type: 设备类型

# ============================================================================
# 事件类型判断规则
# ============================================================================
event_type_rules: |
  ## 事件类型定义

  ### 1. 顶事件（TOP）
  - **定义**：用户指定的最终故障现象，是故障树的根节点
  - **特征**：通常是一个完整的故障描述，包含故障对象和故障模式
  - **示例**："电机过热"、"泵失效"、"阀门无法开启"

  ### 2. 中间事件（INTERMEDIATE）
  - **定义**：介于顶事件和底事件之间的过渡事件，可以继续分解
  - **特征**：有子节点，是故障传导路径上的中间环节
  - **示例**："电源问题"、"轴承故障"、"密封失效"

  ### 3. 底事件（BASIC）
  - **定义**：不可继续分解的根本原因事件，是故障树的叶子节点
  - **特征**：无子节点，代表最基础的故障原因
  - **示例**："电压不稳定"、"润滑不足"、"密封件老化"

  ## 事件类型判断规则

  ### 规则 1：层级位置判断
  - 故障树的根节点一定是顶事件（TOP）
  - 有子节点的事件通常是中间事件（INTERMEDIATE）
  - 无子节点的事件通常是底事件（BASIC）

  ### 规则 2：故障原因判断
  - 顶事件 = 故障现象（"什么坏了"）
  - 中间事件 = 故障原因分类（"哪方面的问题"）
  - 底事件 = 具体故障原因（"为什么坏了"）

  ### 规则 3：可分解性判断
  - 如果一个事件还可以继续追问"为什么？"，则它是中间事件
  - 如果已经追问到最底层（部件损坏、人为失误、环境因素），则是底事件

  ### 规则 4：因果链完整性
  - 顶事件到每个底事件应该有一条完整的因果链
  - 不应该有"跳跃"（如顶事件直接连接底事件，中间没有过渡）

# ============================================================================
# 逻辑门使用规则
# ============================================================================
logic_gate_rules: |
  ## 逻辑门类型定义

  ### 1. OR 门（或门）
  - **定义**：任意一个输入事件发生，输出事件就发生
  - **符号**：半圆形，开口朝上
  - **使用场景**：
    - 多种原因可能导致同一故障
    - 故障原因之间是"或"的关系
  - **示例**：
    - 电机过热可能是：电源问题 OR 轴承故障 OR 绕组问题
    - 只要其中任何一个发生，电机就会过热

  ### 2. AND 门（与门）
  - **定义**：所有输入事件同时发生，输出事件才发生
  - **符号**：矩形
  - **使用场景**：
    - 多个条件必须同时满足才导致故障
    - 故障原因之间是"且"的关系
  - **示例**：
    - 泵无法正常工作：进口阀门关闭 AND 出口阀门关闭
    - 只有两个阀门同时关闭，泵才无法工作

  ### 3. XOR 门（异或门）
  - **定义**：有且只有一个输入事件发生时，输出事件才发生
  - **符号**：带加号的OR门
  - **使用场景**：
    - 多个互斥的原因中只有一个会导致故障
    - 故障原因之间是"排他"的关系
  - **示例**：
    - 电源缺相：A相缺 OR B相缺 OR C相缺（三种情况互斥）

  ## 逻辑门选择指南

  ### 判断使用 OR 门还是 AND 门？

  **问题**：这个故障是"或"的关系还是"且"的关系？

  **判断方法**：
  - 如果问："是A导致的，还是B导致的？" → 使用 OR 门
  - 如果问："是A和B同时导致的？" → 使用 AND 门

  ### 示例对比

  **OR 门示例**：
  - 问题：电机过热的原因有哪些？
  - 答案：电源问题、轴承故障、绕组问题（任一都会导致过热）
  - 结论：使用 OR 门

  **AND 门示例**：
  - 问题：什么情况下液压缸不动作？
  - 答案：液压油压力不足 AND 电磁阀未通电（两个条件必须同时满足）
  - 结论：使用 AND 门

