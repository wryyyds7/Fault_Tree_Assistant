# ============================================================================
# 提示词使用指南
# ============================================================================
usage_guide: |
  ## 如何使用本提示词模板

  ### 1. 基本使用流程
  1. 准备顶事件（如"电机过热"）
  2. 准备相关工业知识（从文档中检索或人工填写）
  3. 准备知识图谱模板（如有）
  4. 将信息填入提示词模板
  5. 调用 LLM 生成故障树

  ### 2. 提示词组成
  一个完整的提示词通常包含：
  - 角色设定：你是一位专业的工业设备故障分析专家
  - 任务说明：基于提供的信息生成故障树
  - 输入信息：顶事件、工业知识、知识图谱模板
  - 输出要求：JSON 格式、字段说明
  - 规则说明：事件类型定义、逻辑门使用规则
  - Few-Shot 示例：完整的输入输出示例

  ### 3. 优化建议
  - Few-Shot 示例应该与当前任务领域相近
  - 底事件关键词列表应根据行业特点调整
  - 逻辑门规则应根据设备类型适当补充
  - 可以添加行业特定的故障模式

  ### 4. 常见问题处理
  - **问题**：LLM 生成的逻辑门类型不准确
    - 解决：在提示词中明确说明 OR 门和 AND 门的判断方法
    - 可以添加更多对比示例

  - **问题**：LLM 生成的底事件不够具体
    - 解决：提供更详细的底事件关键词列表
    - 在示例中展示具体的底事件命名

  - **问题**：LLM 忽略工业知识
    - 解决：在提示词中强调"必须基于提供的工业知识生成"
    - 在 Few-Shot 示例中也使用工业知识

  ### 5. 变量替换说明
  - {top_event}：用户指定的顶事件，如"电机过热"
  - {industrial_knowledge}：从文档中检索的相关段落
  - {kg_template}：知识图谱模板（如有）
  - {user_preferences}：用户的特殊要求（如有）
